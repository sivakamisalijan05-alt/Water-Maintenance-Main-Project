{% extends 'index.html' %}
{% block content %}

<style>
  /* ===== Professional Login Styling ===== */
  .login-section {
    background: #f8fafc;
    padding: 120px 0;
    min-height: 80vh;
    display: flex;
    align-items: center;
  }

  .login-card {
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
    padding: 48px 42px;
    max-width: 450px;
    margin: 0 auto;
  }

  .login-card h2 {
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }

  .login-card p {
    text-align: center;
    font-size: 14.5px;
    color: #6b7280;
    margin-bottom: 30px;
  }

  .form-control {
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #e2e8f0;
    font-size: 14.5px;
    margin-bottom: 20px;
  }

  .form-control::placeholder {
    color: #9ca3af;
  }

  .form-control:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .btn-login {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    border: none;
    border-radius: 999px;
    padding: 13px 52px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #ffffff;
    width: 100%;
    transition: all 0.3s ease;
  }

  .btn-login:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(79, 70, 229, 0.35);
  }

  .forgot-password {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
  }

  .forgot-password a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 500;
  }

  .forgot-password a:hover {
    text-decoration: underline;
  }

  @media (max-width: 576px) {
    .login-section {
      padding: 80px 15px;
    }

    .login-card {
      padding: 32px 26px;
    }
  }
</style>

<!-- ===== Login Section ===== -->
<section class="login-section">

  <div class="container">

    <div class="login-card" data-aos="zoom-in">
      <h2>Login</h2>
      <p>Enter your credentials to access your account</p>

      <form method="post">
        {% csrf_token %}

        <!-- Username -->
        <input type="text" name="username" class="form-control"
               placeholder="Username" required>

        <!-- Password -->
        <input type="password" name="password" class="form-control"
               placeholder="Password" required>

        <!-- Submit -->
        <button type="submit" class="btn-login">Login</button>

     
      </form>

    </div>

  </div>

</section>

{% endblock %}
